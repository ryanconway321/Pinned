<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinned — Sticky Notes</title>
<meta name="description" content="Sticky notes for your desk. Drag them anywhere, or float any note into its own always-on-top window with a tap.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>📌</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#E85D2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinned">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3EEE6;
    --surface:#FFFFFF;
    --surface-2:#EAE1D2;
    --ink:#241C14;
    --ink-soft:#6B5F4E;
    --ink-faint:#9C9080;
    --accent:#E85D2C;
    --accent-ink:#FFFFFF;
    --accent-soft:#FCE1D3;
    --line:#E0D5C3;
    --line-strong:#CFC0A6;
    --shadow: 0 1px 2px rgba(36,28,20,.08), 0 14px 32px -18px rgba(36,28,20,.4);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E1812; --surface:#2A221A; --surface-2:#332A20;
      --ink:#F3EEE6; --ink-soft:#B8AC9C; --ink-faint:#7A7061;
      --accent:#FF7A45; --accent-ink:#241206; --accent-soft:#3D2416;
      --line:#3A3026; --line-strong:#4A3E30;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E1812; --surface:#2A221A; --surface-2:#332A20;
    --ink:#F3EEE6; --ink-soft:#B8AC9C; --ink-faint:#7A7061;
    --accent:#FF7A45; --accent-ink:#241206; --accent-soft:#3D2416;
    --line:#3A3026; --line-strong:#4A3E30;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -18px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:20px;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  .wrap{ max-width:920px; margin:0 auto; padding-block:26px 90px; }

  header.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .pin-mark{ width:26px; height:26px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); flex:0 0 auto; }
  .brand h1{ font-family:"Kalam", cursive; font-weight:700; font-size:24px; margin:0; letter-spacing:-.01em; }
  .support-note{ font-size:12px; color:var(--ink-faint); max-width:34ch; line-height:1.5; text-align:right; }
  @media (max-width:560px){ .support-note{ text-align:left; } }

  .sub{ color:var(--ink-soft); font-size:14px; margin:6px 0 26px; line-height:1.55; max-width:56ch; }

  .board{
    position:relative; min-height:max(460px, 60vh);
  }

  .note-card{
    position:absolute; width:200px; border-radius:6px; padding:30px 16px 44px;
    min-height:170px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    cursor:grab; touch-action:none; user-select:none;
    transition:box-shadow .15s;
  }
  .note-card:hover{ box-shadow:0 4px 10px rgba(36,28,20,.15), 0 22px 40px -18px rgba(36,28,20,.5); }
  .note-card.dragging{
    cursor:grabbing; box-shadow:0 6px 14px rgba(36,28,20,.2), 0 32px 54px -18px rgba(36,28,20,.6);
  }
  .note-card.settling{ transition:transform .38s cubic-bezier(.34,1.56,.64,1), opacity .35s ease, box-shadow .2s; }
  .note-card.crumpling{ animation:crumple .42s ease-in forwards; pointer-events:none; }
  @keyframes crumple{
    0%{ transform:rotate(var(--rot, 0deg)) scale(1) translate(0,0); opacity:1; border-radius:6px; }
    35%{ transform:rotate(calc(var(--rot, 0deg) + 60deg)) scale(.82) translate(4px,-6px); border-radius:38%; }
    100%{ transform:rotate(calc(var(--rot, 0deg) + 260deg)) scale(.18) translate(60px,140px); opacity:0; border-radius:50%; }
  }
  .note-card::before{
    content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:22px; height:14px; border-radius:3px;
    background:rgba(0,0,0,.14);
  }

  .note-text{
    flex:none; width:100%; min-height:70px; resize:none; overflow:hidden; border:none; background:transparent; outline:none;
    font-family:"Kalam", cursive; font-size:16.5px; line-height:1.45; color:#241C14;
    cursor:text;
  }
  .note-text::placeholder{ color:rgba(36,28,20,.4); }

  .checklist{ display:flex; flex-direction:column; gap:3px; flex:none; width:100%; min-height:70px; }
  .check-item{ display:flex; align-items:center; gap:6px; }
  .check-box{ flex:0 0 auto; width:15px; height:15px; accent-color:#241C14; cursor:pointer; }
  .check-text{
    flex:1; min-width:0; border:none; background:transparent; outline:none;
    font-family:"Kalam", cursive; font-size:15px; color:#241C14; padding:1px 0;
  }
  .check-text::placeholder{ color:rgba(36,28,20,.4); }
  .check-item.done .check-text{ text-decoration:line-through; opacity:.5; }
  .check-del{
    flex:0 0 auto; width:16px; height:16px; border:none; background:transparent; color:rgba(36,28,20,.4);
    cursor:pointer; font-size:11px; line-height:1; opacity:0; transition:opacity .12s; padding:0;
  }
  .check-item:hover .check-del{ opacity:1; }
  .check-add{
    align-self:flex-start; font-family:"Work Sans", sans-serif; font-size:12px; font-weight:600;
    color:rgba(36,28,20,.45); background:transparent; border:none; cursor:pointer; padding:2px 0; margin-top:2px;
  }
  .check-add:hover{ color:rgba(36,28,20,.75); }

  .note-footer{
    position:absolute; left:14px; right:14px; bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .color-dots{ display:flex; gap:6px; }
  .color-dot{
    width:15px; height:15px; border-radius:50%; border:1.5px solid rgba(0,0,0,.18); cursor:pointer; padding:0;
  }
  .color-dot.active{ box-shadow:0 0 0 2px rgba(36,28,20,.5); }

  .note-actions{ display:flex; gap:4px; opacity:.55; transition:opacity .12s; }
  .note-card:hover .note-actions, .note-card:focus-within .note-actions{ opacity:1; }
  .icon-btn{
    width:26px; height:26px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,.1); color:rgba(36,28,20,.75);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:rgba(0,0,0,.18); }
  .icon-btn:focus-visible{ outline:2px solid rgba(36,28,20,.5); outline-offset:1px; }

  .floating-badge{
    position:absolute; top:8px; right:10px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    background:rgba(36,28,20,.14); color:#241C14; padding:3px 7px; border-radius:99px;
    display:flex; align-items:center; gap:4px;
  }
  .time-badge{
    position:absolute; top:11px; left:16px; font-size:10.5px; color:rgba(36,28,20,.42);
  }

  .add-fab{
    position:fixed; right:24px; bottom:24px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); border:none; cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.45), var(--shadow);
    font-family:"Kalam", cursive; font-size:30px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    z-index:1000; transition:transform .12s, filter .12s;
  }
  .add-fab:hover{ filter:brightness(1.06); transform:scale(1.05); }
  .add-fab:active{ transform:scale(.96); }
  .add-fab:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(0); opacity:1;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:12px; padding:10px 10px 10px 18px; font-size:13.5px; max-width:min(360px, calc(100vw - 96px));
    text-align:center; transition:opacity .25s, transform .25s; z-index:1001;
    display:flex; align-items:center; gap:10px; justify-content:center;
  }
  .toast.hide{ opacity:0; transform:translateX(-50%) translateY(10px); pointer-events:none; }
  .toast-action{
    font-family:"Work Sans", sans-serif; font-weight:700; font-size:12.5px; color:var(--accent-ink);
    background:var(--accent); border:none; border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .toast-action:hover{ filter:brightness(1.05); }

  .empty-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-faint); font-size:13px; padding:40px 10px; }

  @media (prefers-reduced-motion: reduce){
    .note-card, .toast{ transition:none; }
    .note-card.crumpling{ animation:none; opacity:0; }
  }

  .view-switch{ display:inline-flex; gap:4px; background:var(--surface-2); border-radius:10px; padding:4px; margin-bottom:18px; }
  .view-tab{
    font-family:"Work Sans", sans-serif; font-weight:600; font-size:13px; color:var(--ink-soft);
    background:transparent; border:none; border-radius:7px; padding:8px 16px; cursor:pointer;
  }
  .view-tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .view-tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .view-section[hidden]{ display:none; }

  .k-toolbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .k-toolbar .sub{ margin:6px 0 16px; flex:1; min-width:220px; }
  .k-share-btn{
    flex:0 0 auto; font-family:"Work Sans", sans-serif; font-weight:700; font-size:13px; color:var(--accent-ink);
    background:var(--accent); border:none; border-radius:9px; padding:9px 14px; cursor:pointer; white-space:nowrap;
  }
  .k-share-btn:hover{ filter:brightness(1.05); }
  .k-share-btn.live{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .k-share-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .k-board{ display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:12px; }
  .k-column{
    flex:0 0 260px; width:260px; background:var(--surface-2); border-radius:12px; padding:10px;
    display:flex; flex-direction:column; gap:8px; max-height:70vh;
  }
  .k-col-header{ display:flex; align-items:center; gap:6px; padding:2px 2px 2px 6px; }
  .k-col-title{
    flex:1; min-width:0; font-family:"Work Sans", sans-serif; font-weight:700; font-size:14px; color:var(--ink);
    background:transparent; border:none; outline:none; padding:4px 6px; border-radius:5px;
  }
  .k-col-title:focus{ background:var(--surface); box-shadow:0 0 0 2px var(--accent-soft); }
  .k-col-count{
    font-size:11px; font-weight:700; color:var(--ink-faint); background:var(--surface);
    border-radius:99px; padding:2px 7px; flex:0 0 auto;
  }
  .k-col-del{ flex:0 0 auto; width:24px; height:24px; opacity:.5; }
  .k-col-del:hover{ opacity:1; }
  .k-cards{ display:flex; flex-direction:column; gap:8px; overflow-y:auto; min-height:6px; padding:2px; }
  .k-card{
    background:var(--surface); border-left:4px solid var(--kc, var(--accent)); border-radius:8px;
    padding:9px 10px 8px; box-shadow:0 1px 2px rgba(36,28,20,.08);
    cursor:grab; touch-action:none; user-select:none;
  }
  .k-card:hover{ box-shadow:0 3px 8px rgba(36,28,20,.16); }
  .k-card.dragging-source{ opacity:.35; }
  .k-card-text{
    width:100%; border:none; background:transparent; outline:none; resize:none; overflow:hidden;
    font-family:"Work Sans", sans-serif; font-size:13.5px; line-height:1.45; color:var(--ink); cursor:text;
  }
  .k-card-reminder{ display:flex; align-items:center; gap:6px; margin:2px 0 8px; }
  .k-card-reminder.editing{ margin:2px 0 8px; }
  .k-reminder-add{
    font-family:"Work Sans", sans-serif; font-size:11px; font-weight:600; color:var(--ink-faint);
    background:transparent; border:1px dashed var(--line-strong); border-radius:99px;
    padding:4px 9px; cursor:pointer;
  }
  .k-reminder-add:hover{ border-color:var(--accent); color:var(--accent); }
  .k-due-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
    border-radius:99px; padding:4px 9px; border:none; cursor:pointer;
    background:var(--surface-2); color:var(--ink-soft);
  }
  .k-due-badge.soon{ background:#FCE7B8; color:#7A4E00; }
  .k-due-badge.overdue{ background:#FBD5D0; color:#8C2A1E; }
  .k-due-clear{
    width:19px; height:19px; flex:0 0 auto; border-radius:50%; border:none;
    background:rgba(0,0,0,.1); color:var(--ink-soft); cursor:pointer; font-size:10px; line-height:1;
  }
  .k-due-clear:hover{ background:rgba(0,0,0,.18); }
  .k-due-input{
    font-family:"Work Sans", sans-serif; font-size:12px; border:1px solid var(--line-strong); border-radius:6px;
    padding:4px 6px; background:var(--surface); color:var(--ink); width:100%;
  }

  .k-card-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .k-card-footer .icon-btn{ width:22px; height:22px; opacity:.5; transition:opacity .12s; }
  .k-card:hover .k-card-footer .icon-btn, .k-card:focus-within .k-card-footer .icon-btn{ opacity:1; }
  .k-add-card{
    font-family:"Work Sans", sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-faint);
    background:transparent; border:none; border-radius:7px; padding:8px; text-align:left; cursor:pointer;
  }
  .k-add-card:hover{ background:var(--surface); color:var(--ink); }
  .k-add-col{
    flex:0 0 220px; align-self:flex-start; font-family:"Work Sans", sans-serif; font-weight:600; font-size:13.5px;
    color:var(--ink-faint); background:transparent; border:2px dashed var(--line-strong); border-radius:12px;
    padding:14px; cursor:pointer;
  }
  .k-add-col:hover{ border-color:var(--accent); color:var(--accent); }
  .k-placeholder{ border:2px dashed var(--line-strong); border-radius:8px; background:rgba(0,0,0,.04); box-sizing:border-box; }
  .k-card-ghost{
    position:fixed; z-index:9999; pointer-events:none; opacity:.95; transform:rotate(-2deg);
    box-shadow:0 14px 30px -10px rgba(0,0,0,.4); margin:0;
  }
  .k-cards.drop-target{ background:var(--accent-soft); border-radius:8px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="pin-mark"></span><h1>Pinned</h1></div>
    <div class="support-note" id="supportNote"></div>
  </header>

  <div class="view-switch" role="tablist">
    <button type="button" class="view-tab active" id="tabNotes" role="tab" aria-selected="true">🗒️ Notes</button>
    <button type="button" class="view-tab" id="tabBoard" role="tab" aria-selected="false">📋 Board</button>
  </div>

  <section class="view-section" id="notesView">
    <p class="sub">Quick notes, right where you'd stick them — no account, nothing to install. Drag them around the board, and on Chrome or Edge you can pop one into its own window that floats on top of everything else.</p>
    <div class="board" id="board"></div>
  </section>

  <section class="view-section" id="boardView" hidden>
    <div class="k-toolbar">
      <p class="sub">A simple kanban board — add cards to a list, then drag them across as things move along.</p>
      <button type="button" class="k-share-btn" id="kShareBtn">🔗 Share board</button>
    </div>
    <div class="k-board" id="kanbanBoard"></div>
  </section>
</div>

<button type="button" class="add-fab" id="addFab" aria-label="New note" title="New note (N)">+</button>

<div class="toast hide" id="toast">
  <span id="toastMsg"></span>
  <button type="button" class="toast-action" id="toastAction" hidden></button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
(function(){
  var firebaseReady = false;
  try{
    if (typeof firebase !== 'undefined'){
      firebase.initializeApp({
        apiKey: "AIzaSyAPTcSr3bGVQmLq3tJrVekZA1sqPBxxa58",
        authDomain: "pinned-63a17.firebaseapp.com",
        databaseURL: "https://pinned-63a17-default-rtdb.firebaseio.com",
        projectId: "pinned-63a17",
        storageBucket: "pinned-63a17.firebasestorage.app",
        messagingSenderId: "266023325743",
        appId: "1:266023325743:web:6401d1995ed734656ef6da"
      });
      firebaseReady = true;
    }
  }catch(e){ firebaseReady = false; }

  var board = document.getElementById('board');
  var supportNote = document.getElementById('supportNote');
  var toastEl = document.getElementById('toast');
  var toastMsgEl = document.getElementById('toastMsg');
  var toastActionEl = document.getElementById('toastAction');
  var addFab = document.getElementById('addFab');
  var tabNotes = document.getElementById('tabNotes');
  var tabBoard = document.getElementById('tabBoard');
  var notesView = document.getElementById('notesView');
  var boardView = document.getElementById('boardView');
  var kanbanBoard = document.getElementById('kanbanBoard');
  var kShareBtn = document.getElementById('kShareBtn');

  var SAVE_KEY = 'pinned_notes_v2';
  var COLORS = [
    { key:'yellow', hex:'#FFE066' },
    { key:'pink', hex:'#FF8FB1' },
    { key:'green', hex:'#A8E6A3' },
    { key:'blue', hex:'#8ECDF0' },
    { key:'orange', hex:'#FFB570' }
  ];
  function colorHex(key){ var c = COLORS.find(function(c){ return c.key===key; }); return c ? c.hex : COLORS[0].hex; }

  var supportsPiP = ('documentPictureInPicture' in window);
  supportNote.textContent = supportsPiP
    ? 'Floating works in this browser.'
    : 'Floating notes need Chrome or Edge — notes still work fine here either way.';

  var notes = [];
  var pipWindows = {}; // noteId -> pip window ref
  var zCounter = 10;
  var enteredIds = new Set(); // notes that have already played their arrival animation this visit

  var KANBAN_KEY = 'pinned_kanban_v1';
  var kanban = { columns: [] };
  var kDrag = null; // active cross-column card drag, or null
  var currentView = 'notes';
  var reminderTimers = {}; // cardId -> setTimeout handle
  var openingReminderFor = null; // cardId currently showing the date picker, or null
  var roomId = null;
  var roomRef = null;
  var kanbanSyncTimer = null;
  var lastLocalWriteJSON = null;

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function load(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      notes = raw ? JSON.parse(raw) : null;
    }catch(e){ notes = null; }
    if (!notes){
      try{
        var old = localStorage.getItem('pinned_notes_v1');
        notes = old ? JSON.parse(old) : null;
      }catch(e){}
    }
    if (!notes || !notes.length){
      notes = [
        { id: genId(), color: 'yellow', text: 'Welcome to Pinned — drag any note around, or click it to edit.', rot: -2 },
        { id: genId(), color: 'blue', text: '', checklist: true, items: [
          { id: genId(), text: 'Pick up milk', done: false },
          { id: genId(), text: 'Call the dentist', done: true },
          { id: genId(), text: 'Return the package', done: false }
        ], rot: 1.5 },
        { id: genId(), color: 'pink', text: "Someone's birthday is next week 🎂", rot: -1 }
      ];
    }
    ensurePositions();
  }

  function ensurePositions(){
    var cascade = 0;
    notes.forEach(function(n){
      if (typeof n.x !== 'number' || typeof n.y !== 'number'){
        var col = cascade % 3, row = Math.floor(cascade / 3);
        n.x = 24 + col * 224 + Math.round(Math.random() * 18 - 9);
        n.y = 24 + row * 206 + Math.round(Math.random() * 14 - 7);
        cascade++;
      }
      if (typeof n.z !== 'number'){ n.z = ++zCounter; }
      else if (n.z > zCounter){ zCounter = n.z; }
    });
  }

  function save(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(notes)); }catch(e){}
  }
  function genId(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function showToast(msg, actionLabel, onAction){
    toastMsgEl.textContent = msg;
    toastEl.classList.remove('hide');
    if (actionLabel){
      toastActionEl.textContent = actionLabel;
      toastActionEl.hidden = false;
      toastActionEl.onclick = function(){ onAction(); toastEl.classList.add('hide'); };
    } else {
      toastActionEl.hidden = true;
      toastActionEl.onclick = null;
    }
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.add('hide'); }, actionLabel ? 5000 : 3600);
  }

  function nextCascadePos(){
    var cascade = notes.length;
    var col = cascade % 3, row = Math.floor(cascade / 3);
    return {
      x: 24 + col * 224 + Math.round(Math.random() * 18 - 9),
      y: 24 + row * 206 + Math.round(Math.random() * 14 - 7)
    };
  }

  function addNote(){
    var pos = nextCascadePos();
    var n = {
      id: genId(), color: COLORS[Math.floor(Math.random() * COLORS.length)].key, text: '',
      rot: (Math.random() * 6 - 3).toFixed(1), updatedAt: null,
      x: pos.x, y: pos.y, z: ++zCounter
    };
    notes.push(n);
    save();
    render();
    var el = board.querySelector('[data-id="' + n.id + '"] .note-text');
    if (el) el.focus();
  }

  function playDeleteAnimation(card, id){
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion){ removeNote(id); return; }
    card.classList.add('crumpling');
    setTimeout(function(){ removeNote(id); }, 420);
  }

  function removeNote(id){
    var idx = notes.findIndex(function(n){ return n.id === id; });
    if (idx === -1) return;
    var removed = notes[idx];
    if (pipWindows[id]){ try{ pipWindows[id].close(); }catch(e){} delete pipWindows[id]; }
    notes.splice(idx, 1);
    save();
    render();
    showToast('Note deleted.', 'Undo', function(){
      notes.splice(Math.min(idx, notes.length), 0, removed);
      save();
      render();
    });
  }

  function updateNoteText(id, text){
    var n = notes.find(function(n){ return n.id === id; });
    if (!n) return;
    n.text = text;
    n.updatedAt = text.trim() ? Date.now() : null;
    save();
    var pipTextarea = pipWindows[id] && pipWindows[id]._textarea;
    if (pipTextarea && pipTextarea.value !== text) pipTextarea.value = text;
  }

  function updateNoteColor(id, color){
    var n = notes.find(function(n){ return n.id === id; });
    if (!n) return;
    n.color = color;
    save();
    render();
    if (pipWindows[id]) applyPipColor(id, color);
  }

  function applyPipColor(id, color){
    var win = pipWindows[id];
    if (!win) return;
    try{
      win.document.body.style.background = colorHex(color);
    }catch(e){}
  }

  async function floatNote(note){
    if (!supportsPiP){
      showToast('Floating notes need Chrome or Edge on this device — this note will stay here for now.');
      return;
    }
    if (pipWindows[note.id]){
      try{ pipWindows[note.id].focus(); }catch(e){}
      return;
    }
    try{
      var pipWin = await window.documentPictureInPicture.requestWindow({ width: 260, height: 220 });
      pipWindows[note.id] = pipWin;

      var style = pipWin.document.createElement('style');
      style.textContent =
        'html,body{margin:0;height:100%;}' +
        'body{background:' + colorHex(note.color) + ';font-family:"Kalam",cursive;display:flex;flex-direction:column;box-sizing:border-box;}' +
        'textarea{flex:1;width:100%;border:none;outline:none;background:transparent;resize:none;' +
        'font-family:inherit;font-size:16px;line-height:1.45;color:#241C14;padding:14px 14px 4px;box-sizing:border-box;}' +
        '.dots{display:flex;gap:6px;padding:8px 14px 12px;}' +
        '.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);cursor:pointer;padding:0;}' +
        '.dot.active{box-shadow:0 0 0 2px rgba(36,28,20,.5);}';
      pipWin.document.head.appendChild(style);

      var linkEl = pipWin.document.createElement('link');
      linkEl.rel = 'stylesheet';
      linkEl.href = 'https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap';
      pipWin.document.head.appendChild(linkEl);

      var textarea = pipWin.document.createElement('textarea');
      textarea.value = note.text;
      textarea.placeholder = 'Type your note…';
      textarea.addEventListener('input', function(){ updateNoteText(note.id, textarea.value); });
      pipWin.document.body.appendChild(textarea);
      pipWin._textarea = textarea;
      textarea.focus();

      var dotsRow = pipWin.document.createElement('div');
      dotsRow.className = 'dots';
      COLORS.forEach(function(c){
        var dot = pipWin.document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot' + (c.key === note.color ? ' active' : '');
        dot.style.background = c.hex;
        dot.setAttribute('aria-label', c.key);
        dot.addEventListener('click', function(){
          updateNoteColor(note.id, c.key);
          pipWin.document.body.style.background = c.hex;
          Array.prototype.forEach.call(dotsRow.children, function(d){ d.classList.remove('active'); });
          dot.classList.add('active');
        });
        dotsRow.appendChild(dot);
      });
      pipWin.document.body.appendChild(dotsRow);
      pipWin._dotsRow = dotsRow;

      pipWin.addEventListener('pagehide', function(){
        delete pipWindows[note.id];
        render();
      });

      render();
    }catch(err){
      showToast('Could not open a floating window here (' + (err && err.message ? err.message : 'blocked') + ') — this note will stay on the page.');
    }
  }

  function playArrival(card, note, delay){
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;
    card.style.opacity = '0';
    card.style.transform = 'translateY(-70px) rotate(' + (Number(note.rot) * 4) + 'deg) scale(.7)';
    setTimeout(function(){
      card.classList.add('settling');
      card.style.opacity = '1';
      card.style.transform = 'rotate(' + note.rot + 'deg)';
      setTimeout(function(){ card.classList.remove('settling'); }, 420);
    }, delay);
  }

  function bumpZ(note, card){
    zCounter++;
    note.z = zCounter;
    card.style.zIndex = zCounter;
  }

  function growBoard(){
    var maxBottom = 0;
    notes.forEach(function(n){
      var card = board.querySelector('[data-id="' + n.id + '"]');
      var h = card ? card.offsetHeight : 180;
      var bottom = (n.y || 0) + h;
      if (bottom > maxBottom) maxBottom = bottom;
    });
    var floor = 460;
    try{ floor = Math.max(460, window.innerHeight * 0.6); }catch(e){}
    board.style.minHeight = Math.max(floor, maxBottom + 60) + 'px';
  }

  function toggleChecklist(id){
    var n = notes.find(function(n){ return n.id === id; });
    if (!n) return;
    if (!n.checklist){
      if (!n.items || !n.items.length){
        var lines = (n.text || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
        n.items = lines.map(function(t){ return { id: genId(), text: t, done: false }; });
        if (!n.items.length) n.items = [{ id: genId(), text: '', done: false }];
      }
      n.checklist = true;
    } else {
      n.text = (n.items || []).map(function(it){ return it.text; }).join('\n');
      n.checklist = false;
    }
    n.updatedAt = Date.now();
    save();
    render();
  }

  function addChecklistItem(noteId){
    var n = notes.find(function(n){ return n.id === noteId; });
    if (!n) return;
    if (!n.items) n.items = [];
    var newItem = { id: genId(), text: '', done: false };
    n.items.push(newItem);
    n.updatedAt = Date.now();
    save();
    render();
    var el = board.querySelector('[data-id="' + noteId + '"] .check-text[data-item-id="' + newItem.id + '"]');
    if (el) el.focus();
  }

  function removeChecklistItem(noteId, itemId){
    var n = notes.find(function(n){ return n.id === noteId; });
    if (!n || !n.items) return;
    n.items = n.items.filter(function(i){ return i.id !== itemId; });
    n.updatedAt = Date.now();
    save();
    render();
  }

  function checklistIcon(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 12l3 3 7-7"/></svg>';
  }

  function makeDraggable(card, note){
    var dragging = false, moved = false, pointerId = null;
    var startX = 0, startY = 0, origX = 0, origY = 0;

    card.addEventListener('pointerdown', function(e){
      if (e.target.closest && e.target.closest('textarea, input, .color-dot, .icon-btn, .check-del, .check-add')) return;
      dragging = true; moved = false; pointerId = e.pointerId;
      try{ card.setPointerCapture(pointerId); }catch(err){}
      startX = e.clientX; startY = e.clientY;
      origX = note.x; origY = note.y;
      card.classList.remove('settling');
      card.classList.add('dragging');
      bumpZ(note, card);
    });

    card.addEventListener('pointermove', function(e){
      if (!dragging) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      var boardRect = board.getBoundingClientRect();
      var cw = card.offsetWidth || 200;
      var nx = clamp(origX + dx, 0, Math.max(0, boardRect.width - cw));
      var ny = Math.max(0, origY + dy);
      card.style.left = nx + 'px';
      card.style.top = ny + 'px';
      var tilt = clamp(dx * 0.05, -20, 20);
      card.style.transform = 'rotate(' + tilt + 'deg)';
      note._pendingX = nx; note._pendingY = ny;
    });

    function endDrag(){
      if (!dragging) return;
      dragging = false;
      card.classList.remove('dragging');
      try{ card.releasePointerCapture(pointerId); }catch(err){}
      if (moved){
        if (note._pendingX != null) note.x = note._pendingX;
        if (note._pendingY != null) note.y = note._pendingY;
        card.classList.add('settling');
        card.style.transform = 'rotate(' + note.rot + 'deg)';
        setTimeout(function(){ card.classList.remove('settling'); }, 380);
        save();
        growBoard();
      } else {
        card.style.transform = 'rotate(' + note.rot + 'deg)';
      }
    }

    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
  }

  function render(){
    if (!notes.length){
      board.innerHTML = '<div class="empty-hint">No notes yet — tap the + button to add one.</div>';
      growBoard();
      return;
    }

    var html = notes.map(function(n){
      var floating = !!pipWindows[n.id];
      var ago = timeAgo(n.updatedAt);
      return (
        '<div class="note-card" data-id="' + n.id + '" style="left:' + n.x + 'px; top:' + n.y + 'px; z-index:' + (n.z || 1) + '; transform:rotate(' + n.rot + 'deg); --rot:' + n.rot + 'deg; background:' + colorHex(n.color) + ';">' +
          (ago ? '<div class="time-badge">' + ago + '</div>' : '') +
          (floating ? '<div class="floating-badge">📌 floating</div>' : '') +
          (n.checklist ?
            ('<div class="checklist">' +
              (n.items || []).map(function(it){
                return '<div class="check-item' + (it.done ? ' done' : '') + '" data-item-id="' + it.id + '">' +
                  '<input type="checkbox" class="check-box" data-item-id="' + it.id + '"' + (it.done ? ' checked' : '') + '>' +
                  '<input type="text" class="check-text" data-item-id="' + it.id + '" value="' + escapeHtml(it.text) + '" placeholder="List item…">' +
                  '<button type="button" class="check-del" data-item-id="' + it.id + '" aria-label="Remove item">✕</button>' +
                '</div>';
              }).join('') +
              '<button type="button" class="check-add">+ item</button>' +
            '</div>')
            : ('<textarea class="note-text" placeholder="Type here…">' + escapeHtml(n.text) + '</textarea>')
          ) +
          '<div class="note-footer">' +
            '<div class="color-dots">' +
              COLORS.map(function(c){
                return '<button type="button" class="color-dot' + (c.key===n.color?' active':'') + '" style="background:' + c.hex + ';" data-color="' + c.key + '" aria-label="' + c.key + '"></button>';
              }).join('') +
            '</div>' +
            '<div class="note-actions">' +
              '<button type="button" class="icon-btn checklist-btn" aria-label="Toggle checklist" title="Checklist">' + checklistIcon() + '</button>' +
              '<button type="button" class="icon-btn float-btn" aria-label="Float this note" title="Float">' + floatIcon() + '</button>' +
              '<button type="button" class="icon-btn remove-btn" aria-label="Delete note" title="Delete">' + trashIcon() + '</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    board.innerHTML = html;

    var enterIndex = 0;
    Array.prototype.forEach.call(board.querySelectorAll('.note-card'), function(card){
      var id = card.getAttribute('data-id');
      var note = notes.find(function(n){ return n.id === id; });

      if (note.checklist){
        Array.prototype.forEach.call(card.querySelectorAll('.check-box'), function(cb){
          cb.addEventListener('change', function(){
            var it = (note.items || []).find(function(i){ return i.id === cb.getAttribute('data-item-id'); });
            if (it){
              it.done = cb.checked;
              note.updatedAt = Date.now();
              save();
              cb.closest('.check-item').classList.toggle('done', it.done);
            }
          });
        });
        Array.prototype.forEach.call(card.querySelectorAll('.check-text'), function(ti){
          ti.addEventListener('input', function(){
            var it = (note.items || []).find(function(i){ return i.id === ti.getAttribute('data-item-id'); });
            if (it){ it.text = ti.value; note.updatedAt = Date.now(); save(); }
          });
          ti.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
          ti.addEventListener('keydown', function(e){
            if (e.key === 'Enter'){ e.preventDefault(); addChecklistItem(id); }
          });
        });
        Array.prototype.forEach.call(card.querySelectorAll('.check-del'), function(db){
          db.addEventListener('click', function(){ removeChecklistItem(id, db.getAttribute('data-item-id')); });
        });
        var addItemBtn = card.querySelector('.check-add');
        if (addItemBtn) addItemBtn.addEventListener('click', function(){ addChecklistItem(id); });
      } else {
        var textarea = card.querySelector('.note-text');
        autoGrow(textarea);
        textarea.addEventListener('input', function(e){ updateNoteText(id, e.target.value); autoGrow(textarea); });
        textarea.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      }

      card.querySelector('.checklist-btn').addEventListener('click', function(){ toggleChecklist(id); });
      Array.prototype.forEach.call(card.querySelectorAll('.color-dot'), function(dot){
        dot.addEventListener('click', function(){ updateNoteColor(id, dot.getAttribute('data-color')); });
      });
      card.querySelector('.float-btn').addEventListener('click', function(){ floatNote(note); });
      card.querySelector('.remove-btn').addEventListener('click', function(){ playDeleteAnimation(card, id); });
      makeDraggable(card, note);
      if (!enteredIds.has(id)){
        enteredIds.add(id);
        playArrival(card, note, enterIndex * 70);
        enterIndex++;
      }
    });

    growBoard();
  }

  function floatIcon(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="1.5"/><rect x="13" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';
  }
  function trashIcon(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z"/></svg>';
  }
  function timeAgo(ts){
    if (!ts) return null;
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'edited just now';
    if (mins < 60) return 'edited ' + mins + 'm ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return 'edited ' + hrs + 'h ago';
    var days = Math.round(hrs / 24);
    return 'edited ' + days + 'd ago';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  addFab.addEventListener('click', addNote);

  document.addEventListener('keydown', function(e){
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (currentView === 'notes' && (e.key === 'n' || e.key === 'N')){
      e.preventDefault();
      addNote();
    }
  });

  // ---------- Kanban board ----------

  function defaultKanban(){
    return {
      columns: [
        { id: genId(), title: 'To Do', cards: [
          { id: genId(), text: 'Sketch out the idea', color: 'blue' },
          { id: genId(), text: 'Pick a name', color: 'yellow' }
        ] },
        { id: genId(), title: 'Doing', cards: [
          { id: genId(), text: 'Build the first version', color: 'pink' }
        ] },
        { id: genId(), title: 'Done', cards: [
          { id: genId(), text: 'Have the idea 🎉', color: 'green' }
        ] }
      ]
    };
  }

  function loadKanban(){
    try{
      var raw = localStorage.getItem(KANBAN_KEY);
      kanban = raw ? JSON.parse(raw) : null;
    }catch(e){ kanban = null; }
    if (!kanban || !kanban.columns || !kanban.columns.length){
      kanban = defaultKanban();
    }
  }
  function saveKanban(){
    try{ localStorage.setItem(KANBAN_KEY, JSON.stringify(kanban)); }catch(e){}
    if (roomId && roomRef){
      clearTimeout(kanbanSyncTimer);
      kanbanSyncTimer = setTimeout(function(){
        var json = JSON.stringify(kanban);
        lastLocalWriteJSON = json;
        roomRef.set(kanban);
      }, 250);
    }
  }

  function findColumn(colId){ return kanban.columns.find(function(c){ return c.id === colId; }); }
  function findCardLocation(cardId){
    for (var ci = 0; ci < kanban.columns.length; ci++){
      var col = kanban.columns[ci];
      for (var i = 0; i < col.cards.length; i++){
        if (col.cards[i].id === cardId) return { col: col, index: i };
      }
    }
    return null;
  }
  function findCard(cardId){
    var loc = findCardLocation(cardId);
    return loc ? loc.col.cards[loc.index] : null;
  }

  function addColumn(){
    var col = { id: genId(), title: 'New list', cards: [] };
    kanban.columns.push(col);
    saveKanban();
    renderKanban();
    var input = kanbanBoard.querySelector('.k-col-title[data-col-id="' + col.id + '"]');
    if (input){ input.focus(); input.select(); }
  }

  function deleteColumn(colId){
    var idx = kanban.columns.findIndex(function(c){ return c.id === colId; });
    if (idx === -1) return;
    var removed = kanban.columns[idx];
    kanban.columns.splice(idx, 1);
    saveKanban();
    renderKanban();
    showToast('List "' + removed.title + '" deleted.', 'Undo', function(){
      kanban.columns.splice(Math.min(idx, kanban.columns.length), 0, removed);
      saveKanban();
      renderKanban();
    });
  }

  function addCard(colId){
    var col = findColumn(colId);
    if (!col) return;
    var c = { id: genId(), text: '', color: COLORS[Math.floor(Math.random() * COLORS.length)].key };
    col.cards.push(c);

    renderKanban();

    if (textarea) textarea.focus();
  }

  function deleteCard(cardId){
    var loc = findCardLocation(cardId);
    if (!loc) return;
    var removed = loc.col.cards[loc.index];
    var colId = loc.col.id, idx = loc.index;
    loc.col.cards.splice(idx, 1);
    saveKanban();
    renderKanban();
    showToast('Card deleted.', 'Undo', function(){
      var col = findColumn(colId);
      if (col) col.cards.splice(Math.min(idx, col.cards.length), 0, removed);
      saveKanban();
      renderKanban();
    });
  }

        '<button type="button" class="k-due-clear" data-card-id="' + c.id + '" title="Remove reminder">✕</button>' +

  function renderColumn(col){
    var cardsHtml = col.cards.map(renderCard).join('');
    return '<div class="k-column" data-col-id="' + col.id + '">' +
        '<div class="k-col-header">' +
          '<input type="text" class="k-col-title" data-col-id="' + col.id + '" value="' + escapeHtml(col.title) + '" maxlength="40" aria-label="List name">' +
          '<span class="k-col-count">' + col.cards.length + '</span>' +

  function renderKanban(){
    var html = kanban.columns.map(renderColumn).join('') +
      '<button type="button" class="k-add-col" id="kAddColBtn">+ Add another list</button>';
    kanbanBoard.innerHTML = html;

    var addColBtn = document.getElementById('kAddColBtn');
    if (addColBtn) addColBtn.addEventListener('click', addColumn);

    Array.prototype.forEach.call(kanbanBoard.querySelectorAll('.k-col-title'), function(input){
      input.addEventListener('input', function(){
        var col = findColumn(input.getAttribute('data-col-id'));
        if (col){ col.title = input.value; saveKanban(); }
      });
    });
    Array.prototype.forEach.call(kanbanBoard.querySelectorAll('.k-col-del'), function(btn){
      btn.addEventListener('click', function(){ deleteColumn(btn.getAttribute('data-col-id')); });
    });
    Array.prototype.forEach.call(kanbanBoard.querySelectorAll('.k-add-card'), function(btn){
      btn.addEventListener('click', function(){ addCard(btn.getAttribute('data-col-id')); });
    });
    Array.prototype.forEach.call(kanbanBoard.querySelectorAll('.k-card'), function(card){
      wireCard(card);
    });
  }

  function wireCard(card){
    var id = card.getAttribute('data-card-id');
    var textarea = card.querySelector('.k-card-text');
    autoGrow(textarea);
    textarea.addEventListener('input', function(e){
      var c = findCard(id);
      if (c){ c.text = e.target.value; saveKanban(); }
      autoGrow(textarea);
    });
    textarea.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    Array.prototype.forEach.call(card.querySelectorAll('.color-dot'), function(dot){
      dot.addEventListener('click', function(){
        var c = findCard(id);
        if (c){ c.color = dot.getAttribute('data-color'); saveKanban(); renderKanban(); }
      });
    });
    card.querySelector('.k-card-del').addEventListener('click', function(){ deleteCard(id); });

    var addBtn = card.querySelector('.k-reminder-add');
    if (addBtn) addBtn.addEventListener('click', function(){ openReminderEditor(id); });
    var badgeBtn = card.querySelector('.k-due-badge');
    if (badgeBtn) badgeBtn.addEventListener('click', function(){ openReminderEditor(id); });
    var clearBtn = card.querySelector('.k-due-clear');
    if (clearBtn) clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var c = findCard(id);
      if (c){ c.dueAt = null; saveKanban(); }
      scheduleReminder(id);
      renderKanban();
    });
    var dueInput = card.querySelector('.k-due-input');
    if (dueInput){
      dueInput.addEventListener('click', function(e){ e.stopPropagation(); });
      dueInput.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      dueInput.addEventListener('change', function(){
        var c = findCard(id);
        if (c){
          c.dueAt = dueInput.value ? new Date(dueInput.value).getTime() : null;
          saveKanban();
          if (c.dueAt && window.Notification && Notification.permission === 'default'){
            try{ Notification.requestPermission(); }catch(e){}
          }
          scheduleReminder(id);
        }
        openingReminderFor = null;
        renderKanban();
      });
      dueInput.addEventListener('blur', function(){
        setTimeout(function(){
          if (openingReminderFor === id){ openingReminderFor = null; renderKanban(); }
        }, 150);
      });
    }

    makeCardDraggable(card, id);
    scheduleReminder(id);
  }

  function openReminderEditor(cardId){
    openingReminderFor = cardId;
    renderKanban();
    var input = kanbanBoard.querySelector('.k-due-input[data-card-id="' + cardId + '"]');
    if (input){ input.focus(); try{ input.showPicker && input.showPicker(); }catch(e){} }
  }

  function toDatetimeLocalValue(ts){
    var d = new Date(ts);
    var pad = function(n){ return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDue(ts){
    var now = Date.now();
    var diff = ts - now;
    var d = new Date(ts);
    var nowD = new Date(now);
    var timeStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    var dateLabel;
    if (d.toDateString() === nowD.toDateString()){
      dateLabel = 'today ' + timeStr;
    } else {
      var tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
      if (d.toDateString() === tomorrow.toDateString()){
        dateLabel = 'tomorrow ' + timeStr;
      } else {
        dateLabel = d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + timeStr;
      }
    }
    if (diff < 0) return { label: 'Overdue · ' + dateLabel, cls: 'overdue' };
    if (diff < 24 * 60 * 60 * 1000) return { label: 'Due ' + dateLabel, cls: 'soon' };
    return { label: 'Due ' + dateLabel, cls: '' };
  }

  function scheduleReminder(cardId){
    if (reminderTimers[cardId]){ clearTimeout(reminderTimers[cardId]); delete reminderTimers[cardId]; }
    var card = findCard(cardId);
    if (!card || !card.dueAt) return;
    var delay = card.dueAt - Date.now();
    if (delay <= 0 || delay > 30 * 24 * 60 * 60 * 1000) return;
    reminderTimers[cardId] = setTimeout(function(){
      var c = findCard(cardId);
      delete reminderTimers[cardId];
      if (!c) return;
      showToast('⏰ Reminder: ' + (c.text.trim() || 'Untitled card'));
      if (window.Notification && Notification.permission === 'granted'){
        try{ new Notification('Pinned reminder', { body: c.text.trim() || 'Untitled card' }); }catch(e){}
      }
    }, delay);
  }

  function makeCardDraggable(card, cardId){
    var pointerId = null, dragging = false, moved = false;
    var startX = 0, startY = 0;

    card.addEventListener('pointerdown', function(e){
      if (e.target.closest && e.target.closest('textarea, .color-dot, .icon-btn, .k-due-badge, .k-due-clear, .k-reminder-add, .k-due-input')) return;
      pointerId = e.pointerId; dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      try{ card.setPointerCapture(pointerId); }catch(err){}
    });

    card.addEventListener('pointermove', function(e){
      if (!dragging) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved){
        if (Math.abs(dx) + Math.abs(dy) < 4) return;
        moved = true;
        startCardDrag(card, cardId, e);
      }
      updateCardDrag(e.clientX, e.clientY);
    });

    function endDrag(){
      if (!dragging) return;
      dragging = false;
      try{ card.releasePointerCapture(pointerId); }catch(err){}
      if (moved) finishCardDrag();
      moved = false;
    }
    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
  }

  function startCardDrag(cardEl, cardId, e){
    var rect = cardEl.getBoundingClientRect();
    var ghost = cardEl.cloneNode(true);
    ghost.classList.add('k-card-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);

    var placeholder = document.createElement('div');
    placeholder.className = 'k-placeholder';
    placeholder.style.height = rect.height + 'px';
    cardEl.parentNode.insertBefore(placeholder, cardEl);
    cardEl.classList.add('dragging-source');
    cardEl.style.display = 'none';

    kDrag = {
      cardId: cardId, ghost: ghost, placeholder: placeholder,
      offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top
    };
  }

  function updateCardDrag(x, y){
    if (!kDrag) return;
    kDrag.ghost.style.left = (x - kDrag.offsetX) + 'px';
    kDrag.ghost.style.top = (y - kDrag.offsetY) + 'px';

    Array.prototype.forEach.call(kanbanBoard.querySelectorAll('.k-cards'), function(list){ list.classList.remove('drop-target'); });

    var el = document.elementFromPoint(x, y);
    var listEl = el && el.closest && el.closest('.k-cards');
    if (!listEl) return;
    listEl.classList.add('drop-target');

    var siblings = Array.prototype.filter.call(listEl.children, function(ch){
      return ch !== kDrag.placeholder && ch.classList.contains('k-card');
    });
    var insertBefore = null;
    for (var i = 0; i < siblings.length; i++){
      var r = siblings[i].getBoundingClientRect();
      if (y < r.top + r.height / 2){ insertBefore = siblings[i]; break; }
    }
    if (insertBefore){
      listEl.insertBefore(kDrag.placeholder, insertBefore);
    } else {
      listEl.appendChild(kDrag.placeholder);
    }
  }

  function finishCardDrag(){
    if (!kDrag) return;
    var placeholderEl = kDrag.placeholder;
    var listEl = placeholderEl.parentNode;
    var targetColId = listEl ? listEl.getAttribute('data-col-id') : null;

    Array.prototype.forEach.call(kanbanBoard.querySelectorAll('.k-cards'), function(list){ list.classList.remove('drop-target'); });

    if (targetColId){
      var orderedEls = Array.prototype.filter.call(listEl.children, function(ch){
        return ch.classList.contains('k-card') || ch === placeholderEl;
      });
      var targetIndex = orderedEls.indexOf(placeholderEl);
      var loc = findCardLocation(kDrag.cardId);
      if (loc){
        var movedCard = loc.col.cards.splice(loc.index, 1)[0];
        var targetCol = findColumn(targetColId);
        if (targetCol){
          targetIndex = clamp(targetIndex, 0, targetCol.cards.length);
          targetCol.cards.splice(targetIndex, 0, movedCard);
        } else {
          loc.col.cards.splice(loc.index, 0, movedCard);
        }
        saveKanban();
      }
    }

    if (kDrag.ghost && kDrag.ghost.parentNode) kDrag.ghost.parentNode.removeChild(kDrag.ghost);
    if (kDrag.placeholder && kDrag.placeholder.parentNode) kDrag.placeholder.parentNode.removeChild(kDrag.placeholder);
    kDrag = null;
    renderKanban();
  }

  // ---------- Sharing (real-time synced board) ----------

  function genRoomId(){
    return Math.random().toString(36).slice(2, 8) + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function updateShareBtn(){
    if (!kShareBtn) return;
    if (roomId){
      kShareBtn.textContent = '🟢 Copy link';
      kShareBtn.classList.add('live');
      kShareBtn.title = 'This board is live — copy the link to invite others';
    } else {
      kShareBtn.textContent = '🔗 Share board';
      kShareBtn.classList.remove('live');
      kShareBtn.title = 'Turn this into a shared board others can edit live';
    }
  }

  function connectRoom(id, seedIfEmpty){
    roomId = id;
    roomRef = firebase.database().ref('boards/' + id);
    roomRef.on('value', function(snap){
      var data = snap.val();
      if (data && data.columns){
        var json = JSON.stringify(data);
        if (json === lastLocalWriteJSON) return;
        kanban = data;
        renderKanban();
      } else if (seedIfEmpty){
        kanban = seedIfEmpty;
        lastLocalWriteJSON = JSON.stringify(kanban);
        roomRef.set(kanban);
        renderKanban();
      }
    }, function(err){
      showToast('Could not connect to the shared board (' + (err && err.message ? err.message : 'error') + ').');
    });
    updateShareBtn();
  }

  function copyShareLink(){
    var link = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){
        showToast('Link copied — anyone who opens it can edit this board live.');
      }).catch(function(){
        showToast('Share this link: ' + link);
      });
    } else {
      showToast('Share this link: ' + link);
    }
  }

  function shareBoard(){
    if (!firebaseReady){ showToast('Sharing needs an internet connection.'); return; }
    if (!roomId){
      var newId = genRoomId();
      var url = new URL(window.location.href);
      url.searchParams.set('room', newId);
      window.history.replaceState(null, '', url.toString());
      connectRoom(newId, kanban);
    }
    copyShareLink();
  }

  if (kShareBtn) kShareBtn.addEventListener('click', shareBoard);

  // ---------- View switching ----------

  var VIEW_KEY = 'pinned_active_view';

  function setView(view){
    currentView = view === 'board' ? 'board' : 'notes';
    var isBoard = currentView === 'board';
    notesView.hidden = isBoard;
    boardView.hidden = !isBoard;
    tabNotes.classList.toggle('active', !isBoard);
    tabBoard.classList.toggle('active', isBoard);
    tabNotes.setAttribute('aria-selected', String(!isBoard));
    tabBoard.setAttribute('aria-selected', String(isBoard));
    addFab.hidden = isBoard;
    try{ localStorage.setItem(VIEW_KEY, currentView); }catch(e){}
  }

  tabNotes.addEventListener('click', function(){ setView('notes'); });
  tabBoard.addEventListener('click', function(){ setView('board'); });

  var initialView = 'notes';
  try{ initialView = localStorage.getItem(VIEW_KEY) || 'notes'; }catch(e){}
  setView(initialView);

  load();
  render();

  var urlRoom = null;
  try{ urlRoom = new URLSearchParams(window.location.search).get('room'); }catch(e){}
  if (urlRoom && firebaseReady){
    kanban = { columns: [] };
    connectRoom(urlRoom, defaultKanban());
  } else {
    loadKanban();
  }
  renderKanban();
})();
</script>

<script>
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
