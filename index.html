<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinned — Sticky Notes</title>
<meta name="description" content="Sticky notes for your desk. Float any note into its own always-on-top window with a tap.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>📌</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F3EEE6;
    --surface:#FFFFFF;
    --surface-2:#EAE1D2;
    --ink:#241C14;
    --ink-soft:#6B5F4E;
    --ink-faint:#9C9080;
    --accent:#E85D2C;
    --accent-ink:#FFFFFF;
    --accent-soft:#FCE1D3;
    --line:#E0D5C3;
    --line-strong:#CFC0A6;
    --shadow: 0 1px 2px rgba(36,28,20,.08), 0 14px 32px -18px rgba(36,28,20,.4);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E1812; --surface:#2A221A; --surface-2:#332A20;
      --ink:#F3EEE6; --ink-soft:#B8AC9C; --ink-faint:#7A7061;
      --accent:#FF7A45; --accent-ink:#241206; --accent-soft:#3D2416;
      --line:#3A3026; --line-strong:#4A3E30;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E1812; --surface:#2A221A; --surface-2:#332A20;
    --ink:#F3EEE6; --ink-soft:#B8AC9C; --ink-faint:#7A7061;
    --accent:#FF7A45; --accent-ink:#241206; --accent-soft:#3D2416;
    --line:#3A3026; --line-strong:#4A3E30;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -18px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:20px;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  .wrap{ max-width:920px; margin:0 auto; padding-block:26px 70px; }

  header.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .pin-mark{ width:26px; height:26px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); flex:0 0 auto; }
  .brand h1{ font-family:"Kalam", cursive; font-weight:700; font-size:24px; margin:0; letter-spacing:-.01em; }
  .support-note{ font-size:12px; color:var(--ink-faint); max-width:34ch; line-height:1.5; text-align:right; }
  @media (max-width:560px){ .support-note{ text-align:left; } }

  .sub{ color:var(--ink-soft); font-size:14px; margin:6px 0 26px; line-height:1.55; max-width:56ch; }

  .board{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:18px;
  }

  .note-card{
    position:relative; border-radius:6px; padding:30px 16px 44px;
    min-height:180px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    transform:rotate(var(--rot, 0deg));
    transition:transform .15s;
  }
  .note-card:hover{ transform:rotate(0deg) scale(1.02); z-index:2; }
  .note-card::before{
    content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:22px; height:14px; border-radius:3px;
    background:rgba(0,0,0,.14);
  }

  .note-text{
    flex:none; width:100%; min-height:70px; resize:none; overflow:hidden; border:none; background:transparent; outline:none;
    font-family:"Kalam", cursive; font-size:16.5px; line-height:1.45; color:#241C14;
  }
  .note-text::placeholder{ color:rgba(36,28,20,.4); }

  .note-footer{
    position:absolute; left:14px; right:14px; bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .color-dots{ display:flex; gap:6px; }
  .color-dot{
    width:15px; height:15px; border-radius:50%; border:1.5px solid rgba(0,0,0,.18); cursor:pointer; padding:0;
  }
  .color-dot.active{ box-shadow:0 0 0 2px rgba(36,28,20,.5); }

  .note-actions{ display:flex; gap:4px; opacity:.55; transition:opacity .12s; }
  .note-card:hover .note-actions, .note-card:focus-within .note-actions{ opacity:1; }
  .icon-btn{
    width:26px; height:26px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,.1); color:rgba(36,28,20,.75);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:rgba(0,0,0,.18); }
  .icon-btn:focus-visible{ outline:2px solid rgba(36,28,20,.5); outline-offset:1px; }

  .floating-badge{
    position:absolute; top:8px; right:10px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    background:rgba(36,28,20,.14); color:#241C14; padding:3px 7px; border-radius:99px;
    display:flex; align-items:center; gap:4px;
  }
  .time-badge{
    position:absolute; top:11px; left:16px; font-size:10.5px; color:rgba(36,28,20,.42);
  }

  .add-tile{
    min-height:180px; border-radius:6px; border:2px dashed var(--line-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:transparent; cursor:pointer; color:var(--ink-faint); font-family:"Work Sans", sans-serif; font-weight:600; font-size:13.5px;
  }
  .add-tile:hover{ border-color:var(--accent); color:var(--accent); }
  .add-tile:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .add-tile .plus{ font-family:"Kalam", cursive; font-size:34px; line-height:1; }
  .add-tile .kbd-hint{ font-size:11px; font-weight:500; color:var(--ink-faint); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(0); opacity:1;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:12px; padding:10px 10px 10px 18px; font-size:13.5px; max-width:min(360px, calc(100vw - 40px));
    text-align:center; transition:opacity .25s, transform .25s; z-index:50;
    display:flex; align-items:center; gap:10px; justify-content:center;
  }
  .toast.hide{ opacity:0; transform:translateX(-50%) translateY(10px); pointer-events:none; }
  .toast-action{
    font-family:"Work Sans", sans-serif; font-weight:700; font-size:12.5px; color:var(--accent-ink);
    background:var(--accent); border:none; border-radius:8px; padding:7px 12px; cursor:pointer; white-space:nowrap;
  }
  .toast-action:hover{ filter:brightness(1.05); }

  .empty-hint{ text-align:center; color:var(--ink-faint); font-size:13px; padding:40px 10px; grid-column:1/-1; }

  @media (prefers-reduced-motion: reduce){ .note-card, .toast{ transition:none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="pin-mark"></span><h1>Pinned</h1></div>
    <div class="support-note" id="supportNote"></div>
  </header>
  <p class="sub">Sticky notes for your desk. Tap "Float" to pop one into its own little window that stays on top of everything else — a real floating note, not just another tab.</p>

  <div class="board" id="board"></div>
</div>

<div class="toast hide" id="toast">
  <span id="toastMsg"></span>
  <button type="button" class="toast-action" id="toastAction" hidden></button>
</div>

<script>
(function(){
  var board = document.getElementById('board');
  var supportNote = document.getElementById('supportNote');
  var toastEl = document.getElementById('toast');
  var toastMsgEl = document.getElementById('toastMsg');
  var toastActionEl = document.getElementById('toastAction');

  var SAVE_KEY = 'pinned_notes_v1';
  var COLORS = [
    { key:'yellow', hex:'#FFE066' },
    { key:'pink', hex:'#FF8FB1' },
    { key:'green', hex:'#A8E6A3' },
    { key:'blue', hex:'#8ECDF0' },
    { key:'orange', hex:'#FFB570' }
  ];
  function colorHex(key){ var c = COLORS.find(function(c){ return c.key===key; }); return c ? c.hex : COLORS[0].hex; }

  var supportsPiP = ('documentPictureInPicture' in window);
  supportNote.textContent = supportsPiP
    ? 'Floating works in this browser.'
    : 'Floating notes need Chrome or Edge — notes still work fine here either way.';

  var notes = [];
  var pipWindows = {}; // noteId -> pip window ref

  function load(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      notes = raw ? JSON.parse(raw) : null;
    }catch(e){ notes = null; }
    if (!notes || !notes.length){
      notes = [
        { id: genId(), color: 'yellow', text: 'Welcome to Pinned — type on me, or make a new note below.', rot: -2 },
        { id: genId(), color: 'pink', text: 'Tap "Float" to pop a note into its own always-on-top window.', rot: 1.5 }
      ];
    }
  }
  function save(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(notes)); }catch(e){}
  }
  function genId(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function showToast(msg, actionLabel, onAction){
    toastMsgEl.textContent = msg;
    toastEl.classList.remove('hide');
    if (actionLabel){
      toastActionEl.textContent = actionLabel;
      toastActionEl.hidden = false;
      toastActionEl.onclick = function(){ onAction(); toastEl.classList.add('hide'); };
    } else {
      toastActionEl.hidden = true;
      toastActionEl.onclick = null;
    }
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.add('hide'); }, actionLabel ? 5000 : 3600);
  }

  function addNote(){
    var n = { id: genId(), color: COLORS[Math.floor(Math.random()*COLORS.length)].key, text: '', rot: (Math.random()*6-3).toFixed(1), updatedAt: null };
    notes.push(n);
    save();
    render();
    var el = board.querySelector('[data-id="' + n.id + '"] .note-text');
    if (el) el.focus();
  }

  function removeNote(id){
    var idx = notes.findIndex(function(n){ return n.id === id; });
    if (idx === -1) return;
    var removed = notes[idx];
    if (pipWindows[id]){ try{ pipWindows[id].close(); }catch(e){} delete pipWindows[id]; }
    notes.splice(idx, 1);
    save();
    render();
    showToast('Note deleted.', 'Undo', function(){
      notes.splice(Math.min(idx, notes.length), 0, removed);
      save();
      render();
    });
  }

  function updateNoteText(id, text){
    var n = notes.find(function(n){ return n.id === id; });
    if (!n) return;
    n.text = text;
    n.updatedAt = text.trim() ? Date.now() : null;
    save();
    var pipTextarea = pipWindows[id] && pipWindows[id]._textarea;
    if (pipTextarea && pipTextarea.value !== text) pipTextarea.value = text;
  }

  function updateNoteColor(id, color){
    var n = notes.find(function(n){ return n.id === id; });
    if (!n) return;
    n.color = color;
    save();
    render();
    if (pipWindows[id]) applyPipColor(id, color);
  }

  function applyPipColor(id, color){
    var win = pipWindows[id];
    if (!win) return;
    try{
      win.document.body.style.background = colorHex(color);
    }catch(e){}
  }

  async function floatNote(note){
    if (!supportsPiP){
      showToast('Floating notes need Chrome or Edge on this device — this note will stay here for now.');
      return;
    }
    if (pipWindows[note.id]){
      try{ pipWindows[note.id].focus(); }catch(e){}
      return;
    }
    try{
      var pipWin = await window.documentPictureInPicture.requestWindow({ width: 260, height: 220 });
      pipWindows[note.id] = pipWin;

      var style = pipWin.document.createElement('style');
      style.textContent =
        'html,body{margin:0;height:100%;}' +
        'body{background:' + colorHex(note.color) + ';font-family:"Kalam",cursive;display:flex;flex-direction:column;box-sizing:border-box;}' +
        'textarea{flex:1;width:100%;border:none;outline:none;background:transparent;resize:none;' +
        'font-family:inherit;font-size:16px;line-height:1.45;color:#241C14;padding:14px 14px 4px;box-sizing:border-box;}' +
        '.dots{display:flex;gap:6px;padding:8px 14px 12px;}' +
        '.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.18);cursor:pointer;padding:0;}' +
        '.dot.active{box-shadow:0 0 0 2px rgba(36,28,20,.5);}';
      pipWin.document.head.appendChild(style);

      var linkEl = pipWin.document.createElement('link');
      linkEl.rel = 'stylesheet';
      linkEl.href = 'https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap';
      pipWin.document.head.appendChild(linkEl);

      var textarea = pipWin.document.createElement('textarea');
      textarea.value = note.text;
      textarea.placeholder = 'Type your note…';
      textarea.addEventListener('input', function(){ updateNoteText(note.id, textarea.value); });
      pipWin.document.body.appendChild(textarea);
      pipWin._textarea = textarea;
      textarea.focus();

      var dotsRow = pipWin.document.createElement('div');
      dotsRow.className = 'dots';
      COLORS.forEach(function(c){
        var dot = pipWin.document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot' + (c.key === note.color ? ' active' : '');
        dot.style.background = c.hex;
        dot.setAttribute('aria-label', c.key);
        dot.addEventListener('click', function(){
          updateNoteColor(note.id, c.key);
          pipWin.document.body.style.background = c.hex;
          Array.prototype.forEach.call(dotsRow.children, function(d){ d.classList.remove('active'); });
          dot.classList.add('active');
        });
        dotsRow.appendChild(dot);
      });
      pipWin.document.body.appendChild(dotsRow);
      pipWin._dotsRow = dotsRow;

      pipWin.addEventListener('pagehide', function(){
        delete pipWindows[note.id];
        render();
      });

      render();
    }catch(err){
      showToast('Could not open a floating window here (' + (err && err.message ? err.message : 'blocked') + ') — this note will stay on the page.');
    }
  }

  function render(){
    var html = notes.map(function(n){
      var floating = !!pipWindows[n.id];
      var ago = timeAgo(n.updatedAt);
      return (
        '<div class="note-card" data-id="' + n.id + '" style="--rot:' + n.rot + 'deg; background:' + colorHex(n.color) + ';">' +
          (ago ? '<div class="time-badge">' + ago + '</div>' : '') +
          (floating ? '<div class="floating-badge">📌 floating</div>' : '') +
          '<textarea class="note-text" placeholder="Type here…">' + escapeHtml(n.text) + '</textarea>' +
          '<div class="note-footer">' +
            '<div class="color-dots">' +
              COLORS.map(function(c){
                return '<button type="button" class="color-dot' + (c.key===n.color?' active':'') + '" style="background:' + c.hex + ';" data-color="' + c.key + '" aria-label="' + c.key + '"></button>';
              }).join('') +
            '</div>' +
            '<div class="note-actions">' +
              '<button type="button" class="icon-btn float-btn" aria-label="Float this note" title="Float">' + floatIcon() + '</button>' +
              '<button type="button" class="icon-btn remove-btn" aria-label="Delete note" title="Delete">' + trashIcon() + '</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    board.innerHTML = html + '<button type="button" class="add-tile" id="addTile"><span class="plus">+</span>New note<span class="kbd-hint">or press N</span></button>';

    Array.prototype.forEach.call(board.querySelectorAll('.note-card'), function(card){
      var id = card.getAttribute('data-id');
      var note = notes.find(function(n){ return n.id === id; });
      var textarea = card.querySelector('.note-text');
      autoGrow(textarea);
      textarea.addEventListener('input', function(e){ updateNoteText(id, e.target.value); autoGrow(textarea); });
      Array.prototype.forEach.call(card.querySelectorAll('.color-dot'), function(dot){
        dot.addEventListener('click', function(){ updateNoteColor(id, dot.getAttribute('data-color')); });
      });
      card.querySelector('.float-btn').addEventListener('click', function(){ floatNote(note); });
      card.querySelector('.remove-btn').addEventListener('click', function(){ removeNote(id); });
    });

    document.getElementById('addTile').addEventListener('click', addNote);
  }

  function floatIcon(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="1.5"/><rect x="13" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';
  }
  function trashIcon(){
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z"/></svg>';
  }
  function timeAgo(ts){
    if (!ts) return null;
    var mins = Math.round((Date.now() - ts) / 60000);
    if (mins < 1) return 'edited just now';
    if (mins < 60) return 'edited ' + mins + 'm ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return 'edited ' + hrs + 'h ago';
    var days = Math.round(hrs / 24);
    return 'edited ' + days + 'd ago';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  document.addEventListener('keydown', function(e){
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (e.key === 'n' || e.key === 'N'){
      e.preventDefault();
      addNote();
    }
  });

  load();
  render();
})();
</script>
</body>
</html>
